# version: '3.8'

services:
  # Servidor web Nginx
  nginx:
    image: nginx:alpine
    ports:
      - '8080:80' # Accede en C
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/html
    depends_on:
      - php

  # PHP-FPM
  php:
    build: .
    volumes:
      - ./src:/var/www/html
      - uploads_data:/var/www//html/uploads
    depends_on:
      - mysql

  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-secret}
      MYSQL_DATABASE: ${DB_NAME:-practica_db}
      MYSQL_USER: ${DB_USER:-php_user}
      MYSQL_PASSWORD: ${DB_PASS:-php_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3306:3306'

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - '8081:80' # Accede en http://localhost:8081
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASS:-secret}
    depends_on:
      - mysql

volumes:
  mysql_data:
  uploads_data: