<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
    <style>
        .tabla {
            text-align: center;
            border: 1px solid;
            border-collapse: collapse;
            width: 50%;
        }

        td {
            padding: 10px;
            border: 1px solid;
            transition: background-color 0.5s ease;
        }
        td:hover{
            background-color: rgb(245, 240, 240);
            filter: hue-rotate(45deg);
        }

        #tabla1{
            background: linear-gradient(45deg, red, blue, green);
        }
        #tabla1 th {
            background-color: rgb(0, 238, 238);
        }

        #tabla2 th {
            background-color: rgb(238, 150, 115);
        }

        #tabla3{
            background: linear-gradient(45deg, rgb(247, 188, 165), rgb(80, 209, 241), rgb(4, 83, 107));
            
        }
        #tabla3 th{
            background-color: rgb(110, 243, 110);
        }

        th {
            border: 1px solid;
        }
    </style>
</head>

<body>


    <!-- TABLA 1 -->
    <table id="tabla1" class="tabla">
        <caption>Tabla de ejemplo 1</caption>
        <!-- Cabecera -->
        <thead>
            <tr>
                <th>Columna 1</th>
                <th>Columna 2</th>
                <th>Columna 3</th>
            </tr>
        </thead>

        <!-- Cuerpo -->
        <tbody>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
        </tbody>

    </table>

    <br><br>

    <!-- TABLA 2 -->
    <table id="tabla2" class="tabla">
        <caption>Tabla de ejemplo 2</caption>
        <tr>
            <th>Columna 1</th>
            <th>Columna 2</th>
            <th>Columna 3</th>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
    </table>

    <br><br>

    <table id="tabla3" class="tabla">
        <caption>Tabla de ejemplo 3</caption>
        <thead>
            <tr>
                <th>Columna 1</th>
                <th>Columna 2</th>
                <th>Columna 3</th>
                <th>Columna 4</th>
                <th>Columna 5</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td colspan="2">1</td>
                <td>3</td>
                <td>4</td>
                <td rowspan="2">5</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
                
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
                <td>5</td>
            </tr>
        </tbody>
        <tfoot>
            <td colspan="5">Footer </td>
        </tfoot>
    </table>

</body>

</html>
