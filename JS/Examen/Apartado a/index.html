<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de idade</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  
  <div id="contedor">
    
    <h1>Calculadora de idade</h1>
    
    <label for="ano">Introduce o teu ano de nacemento:</label>
    <input type="number" id="ano" placeholder="ex. 2000">
    <label for="mes">Introduce o teu mes de nacemento:</label>
    <input type="number" id="mes" placeholder="1-12">
    <label for="dia">Introduce o teu día de nacemento:</label>
    <input type="number" id="dia" placeholder="1-31">
    <button id="calcular">Calcular idade</button>

      <p id="resultado"></p>
      <p id="avisos"></p>
  </div>

</body>
</html>
