<!DOCTYPE html>
<html>
<head>
    <title>Verificador de Edad</title>
</head>
<body>
    <label>Edad: </label>
    <input type="number" id="edad">
    <button onclick="verificar()">Verificar</button>
    <p id="resultado"></p>

    <script>
        let edad = document.getElementById('edad');
        let resultado = document.getElementById('resultado');

        function verificar() {
            if (edad.value < 18) {
                resultado.innerHTML = "NO puedes beber";
            } else {
                resultado.innerHTML = "Sí puedes beber";
            }
        }
    </script>
</body>
</html>
