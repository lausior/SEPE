<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Edad</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #736254 0%, #59919D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            background: #ffffff;
        }
        .card-header {
            background: linear-gradient(135deg, #F28F38 0%, #B38156 100%);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 25px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
        }
        .btn-orange {
            background: linear-gradient(135deg, #F28F38 0%, #B38156 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-orange:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(242,143,56,0.4);
            color: white;
        }
        .form-label {
            color: #736254;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .form-control {
            border: 2px solid #B38156;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
        }
        .form-control:focus {
            border-color: #38D2F2;
            box-shadow: 0 0 0 0.2rem rgba(56,210,242,0.25);
        }
        #resultado {
            font-size: 1.3rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 10px;
        }
        .result-success {
            background-color: #E8F4F6;
            color: #59919D;
            border-left: 4px solid #38D2F2;
        }
        .result-error {
            background-color: #FDF5F0;
            color: #F28F38;
            border-left: 4px solid #F28F38;
        }
        .card-body {
            padding: 30px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #FFE0C4;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card">
                    <div class="card-header">
                        <h1 class="mb-0">🍷 Verificador de Edad</h1>
                        <div class="subtitle mt-2">¿Puedes consumir bebidas alcohólicas?</div>
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <label for="edad" class="form-label">📅 Ingresa tu edad:</label>
                            <input type="number" id="edad" class="form-control" placeholder="Ej: 18" min="0" max="120">
                        </div>
                        <div class="d-grid gap-2">
                            <button onclick="verificar()" class="btn-orange btn">
                                🔍 Verificar
                            </button>
                        </div>
                        <div class="mt-4">
                            <p id="resultado"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let edad = document.getElementById('edad');
        let resultado = document.getElementById('resultado');

        function verificar() {
            if (edad.value < 18) {
                resultado.innerHTML = "❌ NO puedes beber";
                resultado.className = "result-error";
            } else {
                resultado.innerHTML = "✅ Sí puedes beber";
                resultado.className = "result-success";
            }
        }
    </script>

    <!-- Bootstrap JS (opcional para ciertas funcionalidades) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
