<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Edad</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #736254;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        main {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        article.card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            background: #ffffff;
            max-width: 500px;
            width: 100%;
        }
        header.card-header {
            background-color: #F28F38;
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 25px;
            text-align: center;
            border: none;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #FFE0C4;
            font-size: 0.9rem;
        }
        section.card-body {
            padding: 30px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            color: #736254;
            font-weight: bold;
            font-size: 1.1rem;
        }
        input {
            border: 2px solid #B38156;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
        }
        input:focus {
            border-color: #38D2F2;
            box-shadow: 0 0 0 0.2rem rgba(56,210,242,0.25);
            outline: none;
        }
        button {
            background-color: #F28F38;
            color: white;
            border: none;
            padding: 12px 30px;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(242,143,56,0.4);
            background-color: #B38156;
        }
        #resultado {
            font-size: 1.3rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
        .result-success {
            background-color: #E8F4F6;
            color: #59919D;
            border-left: 4px solid #38D2F2;
        }
        .result-error {
            background-color: #FDF5F0;
            color: #F28F38;
            border-left: 4px solid #F28F38;
        }
        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: #B38156;
            border-top: 1px solid #f0f0f0;
        }
        @media (max-width: 600px) {
            section.card-body {
                padding: 20px;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <article class="card">
            <header class="card-header">
                <h1>🍷 Verificador de Edad</h1>
                <p class="subtitle">¿Puedes consumir bebidas alcohólicas?</p>
            </header>
            
            <section class="card-body">
                <form onsubmit="event.preventDefault(); verificar();">
                    <div class="form-group">
                        <label for="edad">📅 Ingresa tu edad:</label>
                        <input type="number" id="edad" placeholder="Ej: 18" min="0" max="120" required>
                    </div>
                    <button type="submit">🔍 Verificar</button>
                </form>
                
                <output id="resultado"></output>
            </section>
            
            <footer>
                <p>Beber con responsabilidad</p>
            </footer>
        </article>
    </main>

    <script>
        let edad = document.getElementById('edad');
        let resultado = document.getElementById('resultado');

        function verificar() {
            if (edad.value < 18) {
                resultado.innerHTML = "❌ NO puedes beber";
                resultado.className = "result-error";
            } else {
                resultado.innerHTML = "✅ Sí puedes beber";
                resultado.className = "result-success";
            }
        }
    </script>

    <!-- Bootstrap JS (opcional para ciertas funcionalidades) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
